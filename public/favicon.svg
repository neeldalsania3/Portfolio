<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%" gradientTransform="rotate(160)">
      <stop offset="0%" style="stop-color:#07b6eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#040fe0;stop-opacity:0.99" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer circle with gradient -->
  <circle cx="64" cy="64" r="58" fill="url(#blueGrad)" filter="url(#glow)"/>
  
  <!-- Inner circle -->
  <circle cx="64" cy="64" r="48" fill="#0a0e1a" opacity="0.9"/>
  
  <!-- Letter N with gradient -->
  <path d="M 42 45 L 42 83 L 48 83 L 48 58 L 73 83 L 86 83 L 86 45 L 80 45 L 80 70 L 55 45 Z" 
        fill="url(#blueGrad)" 
        stroke="url(#blueGrad)" 
        stroke-width="1.5"/>
  
  <!-- Accent dots -->
  <circle cx="37" cy="40" r="2.5" fill="#07b6eb" opacity="0.8"/>
  <circle cx="91" cy="88" r="2.5" fill="#040fe0" opacity="0.8"/>
</svg>
